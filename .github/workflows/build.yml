name: Build Android APK (Safe & Fast with Fallbacks)

on:
  workflow_dispatch: # Manual trigger from Actions tab
  push:
    branches:
      - main # Optional: auto-build on push to main
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Prevent hanging builds
    
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Shallow clone for speed

      # 2️⃣ Setup Node.js with fallback
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
        continue-on-error: true

      - name: Verify Node installation
        run: |
          node --version
          npm --version

      # 3️⃣ Setup Java (Gradle needs it)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Don't cache here - will cache manually after android folder exists

      # 4️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 5️⃣ Install dependencies with multiple fallbacks
      - name: Install dependencies
        run: |
          echo "🧩 Installing dependencies..."
          
          # Try npm ci first (faster, uses package-lock.json)
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json, trying npm ci..."
            if npm ci --legacy-peer-deps; then
              echo "✅ npm ci succeeded"
              exit 0
            fi
            echo "⚠️ npm ci failed, trying without legacy-peer-deps..."
            if npm ci; then
              echo "✅ npm ci succeeded without legacy-peer-deps"
              exit 0
            fi
            echo "⚠️ npm ci failed, falling back to npm install..."
          fi
          
          # Fallback to npm install
          if npm install --legacy-peer-deps; then
            echo "✅ npm install succeeded with legacy-peer-deps"
            exit 0
          fi
          
          echo "⚠️ Trying npm install without legacy-peer-deps..."
          npm install
        continue-on-error: false

      # 6️⃣ Clean Android folder (prevent conflicts)
      - name: Clean Android folder
        run: |
          echo "🧹 Cleaning Android folder..."
          rm -rf android ios
          echo "✅ Cleaned successfully"

      # 7️⃣ Expo Prebuild with multiple fallbacks
      - name: Expo prebuild (with fallbacks)
        run: |
          echo "🏗️ Running Expo prebuild..."
          
          # Try 1: Clean prebuild
          if npx expo prebuild --platform android --clean --no-install; then
            echo "✅ Expo prebuild succeeded (clean mode)"
            exit 0
          fi
          
          echo "⚠️ Clean prebuild failed, trying without --clean..."
          
          # Try 2: Normal prebuild
          if npx expo prebuild --platform android --no-install; then
            echo "✅ Expo prebuild succeeded (normal mode)"
            exit 0
          fi
          
          echo "⚠️ Normal prebuild failed, trying with --npm..."
          
          # Try 3: Force npm mode
          if npx expo prebuild --platform android --npm; then
            echo "✅ Expo prebuild succeeded (npm mode)"
            exit 0
          fi
          
          echo "❌ All prebuild attempts failed"
          exit 1

      # 8️⃣ Cache Gradle (AFTER android folder exists)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
        continue-on-error: true

      # 9️⃣ Verify Android folder was created
      - name: Verify Android folder
        run: |
          if [ ! -d "android" ]; then
            echo "❌ Android folder not created!"
            exit 1
          fi
          echo "✅ Android folder exists"
          ls -la android/

      # 🔟 Make Gradlew executable
      - name: Make Gradlew executable
        run: |
          chmod +x android/gradlew
          echo "✅ Gradlew is now executable"

      # 1️⃣1️⃣ Build Debug APK (installable without signing)
      - name: Build Debug APK
        run: |
          echo "🚀 Building debug APK..."
          cd android
          
          # Try with parallel first
          if ./gradlew assembleDebug --no-daemon --parallel --stacktrace; then
            echo "✅ Build succeeded with parallel mode"
            exit 0
          fi
          
          echo "⚠️ Parallel build failed, trying without parallel..."
          
          # Fallback without parallel
          if ./gradlew assembleDebug --no-daemon --stacktrace; then
            echo "✅ Build succeeded without parallel"
            exit 0
          fi
          
          echo "❌ Build failed"
          exit 1

      # 1️⃣2️⃣ Verify APK was created
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ APK created successfully"
          echo "📦 APK size: $APK_SIZE"
          echo "📍 Location: $APK_PATH"

      # 1️⃣3️⃣ Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # 1️⃣4️⃣ Optional: Build Release APK (unsigned)
      - name: Build Release APK (unsigned)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🚀 Building release APK (unsigned)..."
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true
        continue-on-error: true

      # 1️⃣5️⃣ Upload Release APK (if exists)
      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: ignore
        continue-on-error: true

      # 1️⃣6️⃣ Build summary
      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            DEBUG_SIZE=$(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ **Debug APK:** Built successfully ($DEBUG_SIZE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Debug APK:** Build failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            RELEASE_SIZE=$(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)
            echo "✅ **Release APK:** Built successfully ($RELEASE_SIZE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Release APK:** Not built (optional)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download artifacts from the Actions tab above" >> $GITHUB_STEP_SUMMARY
